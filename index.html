<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1626" />
    <meta name="description" content="Start with one old coaster and build a global shipping company." />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Deadweight" />
    <title>Deadweight</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Deadweight<span class="tagline">shipping company</span><span id="build" class="build"></span></div>
      <div class="clock">
        <span class="lbl">Date</span><span id="date"></span>
        <span id="clock-state" class="clock-state"></span>
      </div>
      <div class="time-ctl" role="group" aria-label="Game speed">
        <button id="play" class="tc-play" data-action="toggle-time" aria-label="Pause or run the clock">▶</button>
        <button class="tc-speed" data-action="speed" data-speed="1" aria-label="Normal speed">1×</button>
        <button class="tc-speed" data-action="speed" data-speed="2" aria-label="Double speed">2×</button>
        <button class="tc-speed" data-action="speed" data-speed="4" aria-label="Quadruple speed">4×</button>
      </div>
      <div class="money">
        <span class="lbl">Cash</span><span id="cash"></span>
        <div class="goal"><div class="goal-track"><div id="goal-bar"></div></div><span id="goal-text"></span></div>
      </div>
      <button id="games" class="icon-btn" data-action="games" title="Your games" aria-label="Your games">☰</button>
      <button id="mute" class="icon-btn" data-action="mute" aria-label="Sound on or off">🔊</button>
      <button id="reload" class="icon-btn" title="Check for updates and reload" aria-label="Check for updates and reload">↻</button>
    </header>
    <main class="layout">
      <section class="map-wrap">
        <div id="map"></div>
        <div id="ship-strip" class="ship-strip"></div>
      </section>
      <aside class="panel">
        <nav id="tabs" class="tabs" role="tablist"></nav>
        <div id="panel-body" class="panel-body"></div>
      </aside>
    </main>
    <div id="modal" class="modal" hidden><div id="modal-body" class="modal-body" role="dialog" aria-modal="true"></div></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
